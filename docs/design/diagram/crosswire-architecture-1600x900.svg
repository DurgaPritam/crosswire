<text x="64" y="84" font-family="Geist, Inter, system-ui, sans-serif" font-size="28" font-weight="600" letter-spacing="-.7" fill="#EEEAE4">How a Crosswire incident works</text>
<text x="64" y="116" font-family="Geist, Inter, system-ui, sans-serif" font-size="15" fill="#A9A39B">Each company keeps its code and data at home. Agents meet in a room that Switch addresses for them.</text>
<text x="88" y="193" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" letter-spacing="1" fill="#FF9A83">PAYCO · PRIVATE</text>
<text x="584" y="193" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" letter-spacing="1" fill="#C4BDB3">SHARED ROOM</text>
<text x="584" y="211" font-family="Geist, Inter, system-ui, sans-serif" font-size="12" fill="#8A847C">Switch, server-enforced addressing</text>
<text x="1160" y="193" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" letter-spacing="1" fill="#5EDCCD">SHOPCO · PRIVATE</text>
<text x="276" y="372" font-family="Geist, Inter, system-ui, sans-serif" font-size="13" fill="#8A847C">approves</text>
<text x="276" y="540" font-family="Geist, Inter, system-ui, sans-serif" font-size="13" fill="#8A847C">queries</text>
<text x="1348" y="372" font-family="Geist, Inter, system-ui, sans-serif" font-size="13" fill="#8A847C">approves</text>
<text x="1348" y="540" font-family="Geist, Inter, system-ui, sans-serif" font-size="13" fill="#8A847C">queries</text>
<text x="812" y="372" font-family="Geist, Inter, system-ui, sans-serif" font-size="13" fill="#8A847C">compare</text>
<text x="812" y="540" font-family="Geist, Inter, system-ui, sans-serif" font-size="13" fill="#8A847C">only writer</text>
<text x="512" y="421" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="13" fill="#A3EBC2">approved</text><text x="512" y="437" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="13" fill="#A3EBC2">disclosures</text>
<text x="1088" y="421" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="13" fill="#A3EBC2">approved</text><text x="1088" y="437" text-anchor="middle" font-family="Geist, Inter, system-ui, sans-serif" font-size="13" fill="#A3EBC2">disclosures</text>
<text x="584" y="725" font-family="Geist, Inter, system-ui, sans-serif" font-size="13" fill="#FF7A73">✕ Direct agent-to-agent messages across companies are refused by Switch</text>
<text x="64" y="826" font-family="Geist, Inter, system-ui, sans-serif" font-size="16" fill="#EEEAE4">Dashed edge = company boundary. Only approved fingerprints cross it.</text>
<line x1="1336" y1="820" x2="1356" y2="820" stroke="#FF7E62" stroke-opacity=".7" stroke-width="2" stroke-dasharray="4 3"/><text x="1364" y="824" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" fill="#8A847C">boundary</text>
<line x1="1448" y1="820" x2="1468" y2="820" stroke="#8FE3B4" stroke-width="2"/><text x="1476" y="824" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" fill="#8A847C">approved</text>

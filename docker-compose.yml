# Crosswire services. Company services build from workspace/ (the agents' repos), so
# fixes the agents make there take effect on `just up`. Run `just setup` first.
# All ports bind to 127.0.0.1. Our images are native (arm64 on Apple silicon).
name: crosswire

# PAYCO_SRC / SHOPCO_SRC override the build sources (verify-fixed uses a patched temp copy).
services:
  payco-api:
    build: ${PAYCO_SRC:-./workspace/payco}/api
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET in .env (just setup creates it)}
      CUSTOMER_WEBHOOK_URL: http://shopco-app:3000/webhooks/payco
    ports: ["127.0.0.1:${PAYCO_API_PORT:-7001}:8000"]
    volumes: ["payco-data:/data/payco"]
    depends_on: [shopco-app]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 10

  shopco-app:
    build: ${SHOPCO_SRC:-./workspace/shopco}/app
    command: ["node", "server.js"]
    ports: ["127.0.0.1:${SHOPCO_APP_PORT:-7002}:3000"]
    volumes: ["shopco-data:/data/shopco"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      retries: 10

  shopco-worker:
    build: ${SHOPCO_SRC:-./workspace/shopco}/app
    command: ["node", "worker.js"]
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET in .env}
    volumes: ["shopco-data:/data/shopco"]

  # Evidence servers: each mounts ONLY its own company's private volume, read-only.
  payco-evidence:
    build: {context: ., dockerfile: evidence/payco-mcp/Dockerfile}
    env_file: [{path: ./switch/state/payco-evidence.env, required: false}]   # EVIDENCE_TOKEN (just setup)
    ports: ["127.0.0.1:${PAYCO_EVIDENCE_PORT:-7101}:7101"]
    volumes:
      - "payco-data:/data/payco:ro"
      - "${PAYCO_SRC:-./workspace/payco}/docs:/docs:ro"   # PayCo's public webhook docs
    depends_on: [payco-api]

  shopco-evidence:
    build: {context: ., dockerfile: evidence/shopco-mcp/Dockerfile}
    env_file: [{path: ./switch/state/shopco-evidence.env, required: false}]   # EVIDENCE_TOKEN (just setup)
    ports: ["127.0.0.1:${SHOPCO_EVIDENCE_PORT:-7102}:7102"]
    volumes: ["shopco-data:/data/shopco:ro"]
    depends_on: [shopco-app]

  # The Notary talks to the Switch bridge on the host. Needs neutral/notary/.credentials.json (Phase 7 registers).
  approver:
    # Signs human approvals; the disclosure guard asks it at posting time. Key in the approver-data volume only.
    build: {context: ., dockerfile: approver/Dockerfile}
    # A Switch protocol agent: it reads the rooms through its own Switch connection (credentials from
    # `phase7.py approver` in switch/state/approver/, mounted read-only), never through the chat platform.
    environment:
      SWITCH_BRIDGE_URL: ${NOTARY_BRIDGE_URL_FROM_DOCKER:-http://host.docker.internal:50675}
    volumes:
      - "approver-data:/data"
      - "./workspace:/ws:ro"
      - "./switch/state/approver:/run/approver:ro"   # credentials.json from `phase7.py approver`
    ports: ["127.0.0.1:7400:7400"]
    restart: unless-stopped

  notary:
    profiles: ["notary"]
    build: {context: ., dockerfile: neutral/notary/Dockerfile}
    environment:
      SWITCH_BRIDGE_URL: ${NOTARY_BRIDGE_URL_FROM_DOCKER:-http://host.docker.internal:50675}
    volumes: ["./neutral/notary:/run/notary"]
    restart: unless-stopped

volumes:
  approver-data:
  payco-data:
  shopco-data:
